services:
  - type: web
    name: alexax-voice-assistant
    runtime: node
    plan: free
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: mock
